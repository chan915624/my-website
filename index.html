<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給最可愛的妳</title>
    <style>
        
{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          overflow: hidden;}

        body {
            width: 100vw;
            height: 100vh;
            /* 背景：粉嫩漸層 /
            background: linear-gradient(to bottom, #ffb6c1 0%, #ffc0cb 30%, #e6e6fa 70%, #fffacd 100%);
            / 讓信封圖片在畫面正中央 /
            display: flex;
            justify-content: center;
            align-items: center;
        }

        / --- 信封圖片 --- /
        .envelope {
            width: 80vw;        / 寬度佔手機螢幕的 80% /
            max-width: 350px;   / 電腦上最大不超過 350px /
            height: auto;
            / 加上一點陰影，看起來更立體 /
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.15));
            / 微微傾斜，增加俏皮感 */
            transform: rotate(-5deg);
        }
    </style>
</head>
<body>
    <!-- 這裡直接使用網路上現成的半打開信封圖片 -->
    <img class="envelope" src="https://cdn-icons-png.flaticon.com/512/2965/2965297.png" alt="半打開的信封">
</body>
</html>
