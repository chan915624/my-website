<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給最可愛的妳</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            font-family: 'Microsoft JhengHei', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            /* 粉嫩天空漸層：粉紅 -> 淺紫 -> 鵝黃 */
            background: linear-gradient(to bottom, #ffb6c1 0%, #ffc0cb 30%, #e6e6fa 70%, #fffacd 100%);
            position: relative;
        }

        /* --- 胖胖白雲 --- */
        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.8;
            animation: float 6s ease-in-out infinite;
            box-shadow: 0 10px 20px rgba(255, 182, 193, 0.3);
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 50%;
        }
        /* 雲朵 1 */
        .cloud:nth-child(1) { width: 100px; height: 40px; top: 15%; left: 10%; }
        .cloud:nth-child(1)::before { width: 50px; height: 50px; top: -20px; left: 15px; }
        .cloud:nth-child(1)::after { width: 70px; height: 70px; top: -30px; left: 40px; }
        
        /* 雲朵 2 */
        .cloud:nth-child(2) { width: 140px; height: 50px; top: 30%; right: 15%; animation-delay: 2s; }
        .cloud:nth-child(2)::before { width: 60px; height: 60px; top: -25px; left: 20px; }
        .cloud:nth-child(2)::after { width: 80px; height: 80px; top: -40px; left: 60px; }

        /* 雲朵 3 */
        .cloud:nth-child(3) { width: 80px; height: 30px; top: 50%; left: 20%; animation-delay: 4s; }
        .cloud:nth-child(3)::before { width: 40px; height: 40px; top: -15px; left: 10px; }
        .cloud:nth-child(3)::after { width: 55px; height: 55px; top: -25px; left: 35px; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* --- 飄落的粉紅愛心 --- */
        .heart {
            position: absolute;
            top: -50px;
            color: #ff69b4;
            font-size: 20px;
            animation: fall linear infinite;
            opacity: 0.8;
            z-index: 1;
        }
        /* 設定不同愛心的位置與速度 */
        .heart:nth-child(4) { left: 10%; animation-duration: 6s; animation-delay: 0s; }
        .heart:nth-child(5) { left: 30%; animation-duration: 8s; animation-delay: 1s; font-size: 15px; }
        .heart:nth-child(6) { left: 50%; animation-duration: 5s; animation-delay: 2s; font-size: 25px; }
        .heart:nth-child(7) { left: 70%; animation-duration: 7s; animation-delay: 0.5s; }
        .heart:nth-child(8) { left: 90%; animation-duration: 9s; animation-delay: 3s; font-size: 18px; }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* --- 底部可愛小熊 --- */
        .bear-container {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
        }
        .bear {
            width: 140px;
            height: 120px;
            background: #f4c27a; /* 小熊奶茶色 */
            border-radius: 50% 50% 40% 40%;
            position: relative;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.1);
        }
        /* 耳朵 */
        .bear::before, .bear::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 50px;
            background: #f4c27a;
            border-radius: 50%;
            top: -20px;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.1);
        }
        .bear::before { left: -10px; }
        .bear::after { right: -10px; }

        /* 耳朵內裡 */
        .ear-inner {
            position: absolute;
            width: 25px;
            height: 25px;
            background: #ffb6c1;
            border-radius: 50%;
            top: -10px;
            z-index: 2;
        }
        .ear-left { left: 5px; }
        .ear-right { right: 5px; }

        /* 眼睛 */
        .eye {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            top: 35px;
            z-index: 3;
        }
        .eye-left { left: 40px; }
        .eye-right { right: 40px; }

        /* 鼻子 */
        .nose {
            position: absolute;
            width: 16px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
        }

        /* 腮紅 */
        .blush {
            position: absolute;
            width: 20px;
            height: 12px;
            background: #ffb6c1;
            border-radius: 50%;
            top: 50px;
            opacity: 0.8;
            z-index: 3;
        }
        .blush-left { left: 20px; }
        .blush-right { right: 20px; }
    </style>
</head>
<body>
    <!-- 雲朵 -->
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>

    <!-- 飄落的愛心 -->
    <div class="heart">❤</div>
    <div class="heart">❤</div>
    <div class="heart">❤</div>
    <div class="heart">❤</div>
    <div class="heart">❤</div>

    <!-- 底部的小熊 -->
    <div class="bear-container">
        <div class="bear">
            <div class="ear-inner ear-left"></div>
            <div class="ear-inner ear-right"></div>
            <div class="eye eye-left"></div>
            <div class="eye eye-right"></div>
            <div class="nose"></div>
            <div class="blush blush-left"></div>
            <div class="blush blush-right"></div>
        </div>
    </div>
</body>
</html>
