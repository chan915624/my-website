<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給最可愛的妳</title>
    <style>
        
{
          margin: 0;
          padding: 0;
          box-sizing: border-box;/* 移除了 overflow: hidden，避免被強制卡在邊緣 */}

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #ffb6c1 0%, #ffc0cb 30%, #e6e6fa 70%, #fffacd 100%);
            position: relative;
        }

        /* --- 左上角的文字信封 💌 --- /
        .envelope {
            position: absolute;
            / 改用絕對像素，不再用百分比，位置絕對精準 /
            left: 60px;       / 距離左邊 60px /
            top: 150px;       / 距離頂部 150px，保證避開手機網址列 /
            font-size: 80px;  / 大小 /
            user-select: none;
            line-height: 1;
        }

        / 強制讓 Emoji 旋轉，並加上陰影 /
        .envelope span {
            display: inline-block;   / 這行是關鍵，讓它可以被旋轉 /
            transform: rotate(-15deg); / 向左傾斜 15 度 */
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.15));
        }
    </style>
</head>
<body>
    <div class="envelope"><span>💌</span></div>
</body>
</html>
