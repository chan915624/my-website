<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給最可愛的妳</title>
    <style>
        
{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          overflow: hidden;}

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #ffb6c1 0%, #ffc0cb 30%, #e6e6fa 70%, #fffacd 100%);
            position: relative;
        }

        /* --- 用 CSS 畫出的完美淡藍色愛心 --- /
        .big-heart {
            position: absolute;
            left: 20%;
            top: 15%;
            width: 150px;    / 愛心大小 /
            height: 150px;
            / 🌟 固定向左傾斜 15 度，拿掉跳動動畫 /
            transform: rotate(-15deg);
            transform-origin: center;
        }

        .big-heart::before,
        .big-heart::after {
            content: "";
            position: absolute;
            top: 0;
            width: 75px;
            height: 120px;
            background: #87CEEB; / 淡藍色 */
            border-radius: 75px 75px 0 0;
            box-shadow: 0 10px 20px rgba(135, 206, 235, 0.4);
        }

        .big-heart::before {
            left: 75px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .big-heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
    </style>
</head>
<body>
    <div class="big-heart"></div>
</body>
</html>
