<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>給你的信</title>
<style>
  body { margin:0; height:100vh;
         background:linear-gradient(135deg,#ffdde1,#ee9ca7); font-family:sans-serif; }

  .screen { position:absolute; transition:opacity .5s; }
  #letter { opacity:0; pointer-events:none;
            top:0; left:0; width:100%; height:100%;
            display:flex; flex-direction:column;
            justify-content:center; align-items:center; }

  #envelope { top:20px; left:20px; text-align:center; }

  .env { font-size:50px; }
  .hint { margin-top:6px; font-size:13px; color:#fff; cursor:pointer; letter-spacing:1px; }

  #letter h1 { font-size:56px; color:#e63946; letter-spacing:8px; }
  button { padding:10px 24px; border:none; border-radius:20px;
           background:#e63946; color:#fff; cursor:pointer; }
</style>
</head>
<body>

  <div class="screen" id="envelope">
    <div class="env">✉️</div>
    <p class="hint" onclick="openLetter()">點擊打開</p>
  </div>

  <div class="screen" id="letter">
    <h1>我愛你</h1>
    <button onclick="back()">返回</button>
  </div>

<script>
  var envelope = document.getElementById('envelope');
  var letter   = document.getElementById('letter');

  function openLetter() {
    envelope.style.opacity = 0;
    envelope.style.pointerEvents = 'none';
    letter.style.opacity = 1;
    letter.style.pointerEvents = 'auto';
  }
  function back() {
    letter.style.opacity = 0;
    letter.style.pointerEvents = 'none';
    envelope.style.opacity = 1;
    envelope.style.pointerEvents = 'auto';
  }
</script>

</body>
</html>
