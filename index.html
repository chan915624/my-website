<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給最可愛的妳</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #ffb6c1 0%, #ffc0cb 30%, #e6e6fa 70%, #fffacd 100%);
            position: relative;
        }

        /* --- 淡藍色、向左傾斜的跳動愛心 --- */
        .big-heart {
            position: absolute;
            left: 15%;       
            top: 8%;        
            width: 75px;     /* 🌟 稍微放大 */
            height: 75px;    /* 🌟 稍微放大 */
            animation: heartbeat 1.5s ease-in-out infinite;
            transform-origin: center;
        }

        .big-heart::before,
        .big-heart::after {
            content: "";
            position: absolute;
            top: 0;
            width: 38px;    /* 配合放大 */
            height: 60px;   /* 配合放大 */
            background: #87CEEB; /* 淡藍色 */
            border-radius: 38px 38px 0 0;
            box-shadow: 0 8px 15px rgba(135, 206, 235, 0.4);
        }

        .big-heart::before {
            left: 38px;     /* 配合放大 */
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .big-heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        /* 心跳動畫 + 固定向左傾斜 15 度 */
        @keyframes heartbeat {
            0% { transform: rotate(-15deg) scale(1); }
            50% { transform: rotate(-15deg) scale(1.15); }
            100% { transform: rotate(-15deg) scale(1); }
        }
    </style>
</head>
<body>
    <div class="big-heart"></div>
</body>
</html>
