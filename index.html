<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給最可愛的妳</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #ffb6c1 0%, #ffc0cb 30%, #e6e6fa 70%, #fffacd 100%);
            position: relative;
        }

        /* --- 用 CSS 畫出的淡藍色小愛心 --- */
        .big-heart {
            position: absolute;
            left: 15%;       
            top: 5%;        
            width: 50px;     
            height: 45px;    
            animation: heartbeat 1.5s ease-in-out infinite;
            transform-origin: center;
        }

        .big-heart::before,
        .big-heart::after {
            content: "";
            position: absolute;
            top: 0;
            width: 26px;    
            height: 42px;   
            background: #87CEEB; /* 淡藍色 */
            border-radius: 26px 26px 0 0;
            box-shadow: 0 6px 12px rgba(135, 206, 235, 0.4);
        }

        .big-heart::before {
            left: 25px;     
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .big-heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="big-heart"></div>
</body>
</html>
