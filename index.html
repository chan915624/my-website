<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給最可愛的妳</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        body {
            width: 100vw;
            height: 100vh;
            /* 粉嫩天空漸層：粉紅 -> 淺紫 -> 鵝黃 */
            background: linear-gradient(to bottom, #ffb6c1 0%, #ffc0cb 30%, #e6e6fa 70%, #fffacd 100%);
            position: relative;
        }

        /* --- 靠左側、微微傾斜的跳動愛心 --- */
        .big-heart {
            position: absolute;
            left: 15%;       /* 距離左邊 15% */
            top: 45%;        /* 距離上面 45% */
            font-size: 150px; /* 愛心大小 */
            color: #ff69b4;   /* 愛心顏色 */
            text-shadow: 0 10px 20px rgba(255, 105, 180, 0.4); /* 柔和陰影 */
            /* 改成心跳動畫 */
            animation: heartbeat 1.5s ease-in-out infinite;
            user-select: none;
        }

        /* 像呼吸/心跳一樣的縮放動畫 */
        @keyframes heartbeat {
            0% {
                transform: rotate(-15deg) scale(1);
            }
            50% {
                transform: rotate(-15deg) scale(1.15); /* 放大 15% */
            }
            100% {
                transform: rotate(-15deg) scale(1);
            }
        }
    </style>
</head>
<body>
    <!-- 靠左側、微微傾斜的跳動愛心 -->
    <div class="big-heart">❤</div>
</body>
</html>
