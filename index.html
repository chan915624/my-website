<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夢幻星空</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        body {
            width: 100vw;
            height: 100vh;
            /* 天空底色：從深藍到地平線的暖橘 */
            background: linear-gradient(to bottom, #070b19 0%, #101f3c 30%, #1e3a5f 60%, #4a6e8a 80%, #f2a65a 100%);
            position: relative;
        }

        /* --- 星空層 --- */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 75%;
            background-image: 
                radial-gradient(1px 1px at 5% 10%, #fff, transparent),
                radial-gradient(2px 2px at 15% 25%, #fff, transparent),
                radial-gradient(1px 1px at 25% 5%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 35% 40%, #fff, transparent),
                radial-gradient(2px 2px at 45% 15%, #fff, transparent),
                radial-gradient(1px 1px at 55% 55%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 65% 30%, #fff, transparent),
                radial-gradient(2px 2px at 75% 65%, #fff, transparent),
                radial-gradient(1px 1px at 85% 20%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 95% 50%, #fff, transparent),
                radial-gradient(1px 1px at 10% 70%, #fff, transparent),
                radial-gradient(2px 2px at 30% 80%, #fff, transparent),
                radial-gradient(1px 1px at 60% 85%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 80% 90%, #fff, transparent);
            background-size: 300px 300px;
            animation: twinkle 5s infinite alternate;
            z-index: 1;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* --- 月亮 --- */
        .moon {
            position: absolute;
            top: 12%;
            right: 30%;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            box-shadow: 
                inset -12px 0 0 0 #c4e3ff, /* 月亮的亮面 */
                0 0 40px 10px rgba(135, 206, 250, 0.5), /* 外光暈 */
                0 0 80px 20px rgba(135, 206, 250, 0.2);
            transform: rotate(-15deg);
            z-index: 2;
        }

        /* --- 流星群 (帶尾巴) --- */
        .meteor {
            position: absolute;
            width: 150px; /* 流星長度 */
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 100%);
            border-radius: 50%;
            opacity: 0;
            transform: rotate(-35deg); /* 流星角度 */
            animation: shoot linear infinite;
            z-index: 3;
        }

        /* 設定不同流星的起點與時間 */
        .meteor:nth-child(1) { top: 5%; left: 70%; animation-duration: 3s; animation-delay: 0s; }
        .meteor:nth-child(2) { top: 25%; left: 90%; animation-duration: 4.5s; animation-delay: 1.5s; }
        .meteor:nth-child(3) { top: 15%; left: 40%; animation-duration: 2.8s; animation-delay: 3s; }
        .meteor:nth-child(4) { top: 45%; left: 80%; animation-duration: 5s; animation-delay: 0.8s; }
        .meteor:nth-child(5) { top: 10%; left: 20%; animation-duration: 3.5s; animation-delay: 4s; }

        @keyframes shoot {
            0% { 
                transform: translate(0, 0) rotate(-35deg); 
                opacity: 0; 
            }
            10% { opacity: 1; }
            100% { 
                transform: translate(-800px, 600px) rotate(-35deg); 
                opacity: 0; 
            }
        }

        /* --- 山脈與地平線 --- */
        .mountains {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: 4;
        }

        /* 地平線暖光 */
        .glow {
            position: absolute;
            bottom: 25%;
            left: 0;
            width: 100%;
            height: 20%;
            background: radial-gradient(ellipse at bottom, rgba(255, 180, 100, 0.3) 0%, transparent 70%);
            filter: blur(15px);
            z-index: 1;
        }

        .mountain-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 第1層 (最遠) */
        .layer-1 {
            background: #2a4b6e;
            clip-path: polygon(0% 100%, 0% 70%, 15% 50%, 30% 65%, 45% 40%, 60% 55%, 75% 45%, 90% 60%, 100% 50%, 100% 100%);
            opacity: 0.7;
        }
        /* 第2層 */
        .layer-2 {
            background: #1c3450;
            clip-path: polygon(0% 100%, 0% 80%, 10% 65%, 25% 75%, 40% 55%, 55% 70%, 70% 50%, 85% 65%, 100% 55%, 100% 100%);
        }
        /* 第3層 */
        .layer-3 {
            background: #0f2136;
            clip-path: polygon(0% 100%, 0% 85%, 20% 70%, 35% 85%, 50% 65%, 65% 80%, 80% 70%, 100% 85%, 100% 100%);
        }
        /* 第4層 (最近，最深色) */
        .layer-4 {
            background: #06101c;
            clip-path: polygon(0% 100%, 0% 95%, 15% 85%, 30% 95%, 45% 80%, 60% 90%, 75% 85%, 90% 95%, 100% 90%, 100% 100%);
        }

        /* --- 前景松樹 --- */
        .tree {
            position: absolute;
            bottom: 0;
            right: 10%;
            width: 0;
            height: 0;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 160px solid #03080e;
            z-index: 5;
        }
        .tree::before {
            content: '';
            position: absolute;
            bottom: -200px;
            left: -25px;
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 100px solid #03080e;
        }
        .tree-2 {
            position: absolute;
            bottom: 0;
            right: 25%;
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 100px solid #03080e;
            z-index: 5;
        }
    </style>
</head>
<body>
    <!-- 星空與流星 -->
    <div class="stars"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    <div class="meteor"></div>
    
    <!-- 月亮 -->
    <div class="moon"></div>

    <!-- 山脈與地平線 -->
    <div class="mountains">
        <div class="glow"></div>
        <div class="mountain-layer layer-1"></div>
        <div class="mountain-layer layer-2"></div>
        <div class="mountain-layer layer-3"></div>
        <div class="mountain-layer layer-4"></div>
    </div>

    <!-- 前景樹木 -->
    <div class="tree"></div>
    <div class="tree-2"></div>
</body>
</html>
