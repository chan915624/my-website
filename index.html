<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>給薯條</title>
<style>
  body { margin:0; min-height:100vh;
         background:linear-gradient(135deg,#ffdde1,#ee9ca7); font-family:sans-serif; }

  .screen { position:absolute; transition:opacity .5s; }

  #letter { opacity:0; pointer-events:none;
            top:0; left:0; width:100%; min-height:100vh;
            display:flex; flex-direction:column;
            justify-content:center; align-items:center;
            padding:30px 20px; box-sizing:border-box; }

  #envelope { top:20px; left:20px; text-align:center; }
  .env { font-size:50px; }
  .hint { margin-top:6px; font-size:13px; color:#87CEEB; cursor:pointer; letter-spacing:1px; }

  #letter p {
    font-size:20px;
    color:#e63946;
    line-height:1.9;
    text-align:center;
    max-width:500px;
    margin-bottom:20px;
  }

  .link {
    color:#4A90D9;
    text-decoration:underline;
    cursor:pointer;
    font-weight:bold;
  }

  button { margin-top:10px; padding:10px 24px; border:none; border-radius:20px;
           background:#ffffff; color:#000000; cursor:pointer; font-size:15px; }

  #photo-screen { opacity:0; pointer-events:none;
                  top:0; left:0; width:100%; min-height:100vh;
                  display:flex; flex-direction:column;
                  justify-content:center; align-items:center;
                  padding:20px; box-sizing:border-box; }

  #photo-screen img { max-width:90%; max-height:70vh; border-radius:15px;
                      box-shadow:0 15px 40px rgba(0,0,0,.25); }
</style>
</head>
<body>

  <div class="screen" id="envelope">
    <div class="env">✉️</div>
    <p class="hint" onclick="openLetter()">點擊打開</p >
  </div>

  <div class="screen" id="letter">
    <p>
      我們9月9號開始一整天貼貼，<br>
      雖然我們都沒有說話，但是感覺你很可愛。<br>
      <span class="link" onclick="openPhoto()">點擊看圖片</span>
    </p >
    <button onclick="back()">返回</button>
  </div>

  <div class="screen" id="photo-screen">
    < img src="photo.png" alt="照片">
    <button onclick="backToLetter()">返回</button>
  </div>

<script>
  var envelope = document.getElementById('envelope');
  var letter   = document.getElementById('letter');
  var photo    = document.getElementById('photo-screen');

  function show(el)  { el.style.opacity = 1; el.style.pointerEvents = 'auto'; }
  function hide(el)  { el.style.opacity = 0; el.style.pointerEvents = 'none'; }

  function openLetter() {
    hide(envelope); show(letter);
  }
  function back() {
    hide(letter); hide(photo);
    show(envelope);
  }
  function openPhoto() {
    hide(letter); show(photo);
  }
  function backToLetter() {
    hide(photo); show(letter);
  }
</script>

</body>
</html>
