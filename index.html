<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給最可愛的妳</title>
    <style>
        
{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          overflow: hidden;}

        body {
            width: 100vw;
            height: 100vh;
            /* 粉嫩天空漸層背景 /
            background: linear-gradient(to bottom, #ffb6c1 0%, #ffc0cb 30%, #e6e6fa 70%, #fffacd 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        / --- 信封容器 --- /
        .envelope-container {
            position: relative;
            width: 300px;
            height: 200px;
            / 整體稍微傾斜，看起來更俏皮 /
            transform: rotate(-5deg);
        }

        / --- 信封主體（下半部） --- /
        .envelope-body {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: #fdf2f8; / 淡粉白 /
            border-radius: 8px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            z-index: 3;
            overflow: hidden;
        }

        / 信封底部的三角形折線 /
        .envelope-body::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 100px solid #fce7f3; / 淺粉色 /
            z-index: 4;
        }

        / 信封兩側的折線 /
        .envelope-body::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-top: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-left: 150px solid #fbcfe8; / 稍微深一點的粉色 /
            z-index: 5;
        }

        / --- 打開的封蓋（往後翻） --- /
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 110px solid #f9a8d4; / 封蓋顏色 /
            transform-origin: top;
            / 往後翻開 180 度 /
            transform: rotateX(180deg);
            z-index: 1;
            border-radius: 8px 8px 0 0;
        }

        / --- 露出的信紙 --- /
        .letter {
            position: absolute;
            top: -30px; / 讓信紙稍微露出來 /
            left: 15px;
            width: 270px;
            height: 180px;
            background: #ffffff;
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            text-align: center;
            font-family: 'Microsoft JhengHei', sans-serif;
        }

        .letter h2 {
            color: #d63384;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .letter p {
            color: #ff69b4;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        / 信紙上的小愛心裝飾 */
        .letter::before {
            content: "💌";
            font-size: 2rem;
            margin-bottom: 10px;
        }

    </style>
</head>
<body>
    <div class="envelope-container">
        <!-- 往後翻開的封蓋 -->
        <div class="envelope-flap"></div>

        <!-- 露出的信紙 (文字可以自己改) -->
        <div class="letter">
            <h2>親愛的寶貝</h2>
            <p>這是一封<br>專屬給妳的信 💖</p>
        </div>

        <!-- 信封主體 -->
        <div class="envelope-body"></div>
    </div>
</body>
</html>
