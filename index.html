<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給最可愛的妳</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: linear-gradient(to bottom, #ffb6c1 0%, #ffc0cb 30%, #e6e6fa 70%, #fffacd 100%);
        }

        /* --- 左上角的斜信封 💌 --- /
        .envelope {
            position: fixed; 

            / 這裡就是你要的位置：左上角，但留有一點空間 /
            top: 12%;        / 距離頂部 12%，不會被瀏海擋住，也不會太下面 /
            left: 12%;       / 距離左邊 12%，不會貼死左邊 /

            font-size: 90px; / 大小適中 /

            / 保證會斜！ /
            transform: rotate(-20deg); 
            -webkit-transform: rotate(-20deg); / 針對 iPhone 的保險 */

            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.15));
            user-select: none;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div class="envelope">💌</div>
</body>
</html>
