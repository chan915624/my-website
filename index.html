<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給最可愛的妳</title>
    <style>
        
{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          overflow: hidden;}

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #ffb6c1 0%, #ffc0cb 30%, #e6e6fa 70%, #fffacd 100%);
            position: relative;
        }

        /* --- 左上角的文字信封 💌 --- /
        .envelope {
            position: absolute;
            left: 18%;       / 往右移，不要貼左邊 /
            top: 18%;        / 往下移，不要貼上面 /
            font-size: 80px; / 大小適中，不會太巨大 /
            transform: rotate(-15deg); / 斜斜的 */
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.15));
            user-select: none;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div class="envelope">💌</div>
</body>
</html>
