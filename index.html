<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給最可愛的妳</title>
    <style>
        
{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          overflow: hidden;}

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #ffb6c1 0%, #ffc0cb 30%, #e6e6fa 70%, #fffacd 100%);
            position: relative;
        }

        /* --- 左上角的文字信封 💌 --- /
        .envelope {
            position: absolute;
            left: 12%;       / 距離左邊 12%，不會太貼邊 /
            top: 15%;        / 距離上面 15%，避開瀏海跟網址列 /
            font-size: 80px; / 大小適中 /
            user-select: none;
            line-height: 1;
        }

        / 關鍵：用 span 強制讓 Emoji 可以旋轉 /
        .envelope span {
            display: inline-block;   / 讓它變成區塊才能轉 /
            transform: rotate(-15deg); / 向左傾斜 15 度 */
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.15));
        }
    </style>
</head>
<body>
    <div class="envelope"><span>💌</span></div>
</body>
</html>
